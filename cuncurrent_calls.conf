I want an asterisk dialplan to check if the number of calls is greater than 10, forward the call to an extension


Plaintext

[macro-check-call-limit]
; This macro checks the current number of active calls to a specific extension
; and forwards the call if the limit is exceeded.
; Arguments:
;   ARG1: The extension to check the call limit against.
;   ARG2: The extension to forward the call to if the limit is exceeded.

exten => s,1,Set(CALLCOUNT=${GROUP_COUNT(active_calls_${ARG1})})
exten => s,n,NoOp(Current calls for ${ARG1}: ${CALLCOUNT})
exten => s,n,ExecIf($[${CALLCOUNT} > 10]?Goto(s,call_limit_exceeded))
exten => s,n,Return() ; Continue with normal call flow

exten => s,n(call_limit_exceeded),NoOp(Call limit exceeded for ${ARG1}. Forwarding to ${ARG2}.)
exten => s,n,Goto(${ARG2},s,1) ; Forward the call

[incoming-calls]
; Example context for incoming calls

exten => 1234,1,Set(GROUP(active_calls_1234)=1) ; Mark this call as active for extension 1234
exten => 1234,n,Macro(check-call-limit,1234,9000) ; Check call limit for 1234, forward to 9000
exten => 1234,n,Dial(SIP/user1&SIP/user2,20,Ttr) ; Dial the users
exten => 1234,n,Hangup()

exten => 9000,1,Answer()
exten => 9000,n,Playback(agent-not-avail) ; Play a message
exten => 9000,n,Hangup()

; Ensure calls are removed from the group upon hangup
exten => h,1,NoOp(Call ended for ${EXTEN}. Removing from active_calls group.)
exten => h,n,Set(GROUP_COUNT(active_calls_${EXTEN})=-1) ; Decrement the group count
Explanation:

[macro-check-call-limit]:

This is a reusable macro that takes two arguments:

ARG1: The extension number you want to monitor for call limits.

ARG2: The extension number to which the call should be forwarded if the limit is exceeded.

exten => s,1,Set(CALLCOUNT=${GROUP_COUNT(active_calls_${ARG1})}):

GROUP_COUNT() is an Asterisk function that counts the number of members in a specific call group.

We're using a dynamic group name active_calls_${ARG1}. This means for extension 1234, the group would be active_calls_1234.

The result is stored in the CALLCOUNT variable.

exten => s,n,NoOp(Current calls for ${ARG1}: ${CALLCOUNT}): Logs the current call count for debugging purposes.

exten => s,n,ExecIf($[${CALLCOUNT} > 10]?Goto(s,call_limit_exceeded)):

ExecIf() is a conditional execution application.

$[${CALLCOUNT} > 10] is a simple condition: if CALLCOUNT is greater than 10.

If the condition is true, it executes Goto(s,call_limit_exceeded), which jumps to the call_limit_exceeded priority within the same macro.

exten => s,n,Return(): If the call limit is not exceeded, the macro returns, allowing the dialplan to continue to the next priority after the macro call.

exten => s,n(call_limit_exceeded),NoOp(Call limit exceeded for ${ARG1}. Forwarding to ${ARG2}.): This is the target for the Goto if the limit is exceeded. It logs a message.

exten => s,n,Goto(${ARG2},s,1): This is the core forwarding logic. It transfers the call to the extension specified in ARG2, starting at priority 1 in that extension's context.

[incoming-calls]:

This is an example context where you would handle your incoming calls.

exten => 1234,1,Set(GROUP(active_calls_1234)=1):

Crucially, at the beginning of a call to extension 1234, we add the current call to the active_calls_1234 group. This increments the count for that group.

The =1 simply adds the current channel to the group. The specific value doesn't matter as much as the act of adding it.

exten => 1234,n,Macro(check-call-limit,1234,9000):

This line calls our macro-check-call-limit.

1234 is passed as ARG1 (the extension to check).

9000 is passed as ARG2 (the forwarding extension).

exten => 1234,n,Dial(SIP/user1&SIP/user2,20,Ttr): If the call limit is not exceeded, the call proceeds to dial the intended users.

exten => 1234,n,Hangup(): Hangs up the call after dialing.

exten => 9000,1,Answer():

This is the extension where calls are forwarded if the limit is exceeded.

You would typically play a message here, explaining that agents are busy, or route to voicemail, etc.

exten => h,1,NoOp(Call ended for ${EXTEN}. Removing from active_calls group.):

The h extension context is executed when a channel hangs up. This is vital for correctly decrementing the call count.

Set(GROUP_COUNT(active_calls_${EXTEN})=-1): This decrements the count of the group associated with the extension that just hung up. This ensures the GROUP_COUNT accurately reflects the active calls.

How to Implement:

Save the dialplan: You would typically add this to your extensions.conf file (or an included file like extensions_custom.conf if you're using FreePBX or a similar system).

Reload Asterisk: After making changes to extensions.conf, you need to reload Asterisk for the changes to take effect. You can do this from the Asterisk CLI: dialplan reload or core reload.

Important Considerations:

Concurrency vs. Call Attempts: This dialplan counts currently active calls. If you want to limit call attempts (even if they don't connect), you might need a different mechanism, perhaps using a database or a more complex custom application.

Persistent Data: GROUP_COUNT is volatile and resets if Asterisk is restarted. For more robust and persistent call limiting, especially in a clustered environment, you might consider:

External Database: Using a database to store and track active calls.

Shared Memory (e.g., func_odbc with a database backend): More advanced Asterisk setups can leverage shared memory or database functions for inter-process communication.

Error Handling: You might want to add more robust error handling, such as playing different messages or routing to different extensions based on specific scenarios.

Scalability: For very high call volumes, constantly querying GROUP_COUNT might have a minor performance impact, but for most typical scenarios (tens to hundreds of concurrent calls), it's perfectly fine.

Dynamic Extension Limits: If you need different call limits for different extensions, you could pass the limit as a third argument to the macro and use that in the ExecIf condition.